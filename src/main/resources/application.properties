spring.application.name=practica_

# Credenciales y URL de la BD: nunca en el repositorio.
# Local: application-local.properties (perfil "local") / .env
# Render: variables de entorno DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${PORT:8080}

# 'update': crea o actualiza las tablas sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect